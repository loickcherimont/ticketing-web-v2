<section class="container py-4">
  <div class='row justify-content-center'>
    <div class='col-12 col-md-8 col-lg-6'>
      <div class='card shadow-sm'>
        <h2 class='card-title text-center mb-4'>Nouveau ticket</h2>
        <div class='card-body p-4'>
          <form [formRoot]='ticketForm'>
            @if (ticketForm().getError('create-failed')?.message; as globalErrorMessage) {
            <div class='alert alert-danger py-2' role='alert'>{{ globalErrorMessage }}</div>
            }
            <div class='mb-3'>
              <label class='form-label' for='title'>Titre</label>
              <input id='title' class='form-control' [formField]='ticketForm.title' type='text'>
              @if (ticketForm.title().getError('required')?.message) {
              <div class='text-danger small mt-1'>Le titre est requis</div>
              }
            </div>
            <div class='mb-3'>
              <label class='form-label' for='description'>Description</label>
              <textarea id='description' class='form-control' [formField]='ticketForm.description' rows='4'></textarea>
              @if (ticketForm.description().getError('required')?.message) {
              <div class='text-danger small mt-1'>La description est requise</div>
              }
            </div>
            <div class='d-flex gap-2'>
              <button class='btn btn-primary flex-fill' type='submit'>Créer le ticket</button>
              <button class='btn btn-outline-secondary' type='button' (click)='goBack()'>Retour</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
